spring.application.name=ShopNest
server.port=8081

# Reads DB_USERNAME, DB_PASSWORD, DB_PORT from the .env file in the project root
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/shopnest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
