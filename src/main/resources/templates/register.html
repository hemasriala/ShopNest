<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign up')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: messages}"></div>
<div class="form-box panel">
    <h1>Create your account</h1>
    <form th:action="@{/register}" method="post">
        <label for="name">Full name</label><input id="name" name="name" required>
        <label for="email">Email</label><input id="email" type="email" name="email" required>
        <label for="phone">Phone number</label><input id="phone" name="phone" pattern="[0-9]{10}" title="Enter a 10 digit mobile number" required>
        <label for="password">Password (min 6 characters)</label><input id="password" type="password" name="password" minlength="6" required>
        <p><button class="btn btn-block" type="submit">Sign up</button></p>
    </form>
    <p class="muted">Already have an account? <a th:href="@{/login}">Log in</a></p>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
