<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: messages}"></div>
<div class="detail">
    <img th:src="${product.imageUrl}" th:alt="${product.name}"
         onerror="this.onerror=null;this.src='https://placehold.co/500x400?text=No+Image';">
    <div>
        <a class="muted" th:href="@{/products(category=${product.category})}" th:text="${product.category}">Category</a>
        <h1 th:text="${product.name}">Name</h1>
        <div>
            <span class="price" th:text="${@fmt.rupee(product.price)}">₹0</span>
            <span class="mrp" th:if="${product.discountPercent > 0}" th:text="${@fmt.rupee(product.mrp)}"></span>
            <span class="off" th:if="${product.discountPercent > 0}" th:text="${product.discountPercent} + '% off'"></span>
        </div>
        <p th:text="${product.description}">Description</p>
        <p class="in-stock" th:if="${product.stock > 0}" th:text="'In stock (' + ${product.stock} + ' available)'"></p>
        <p class="out-stock" th:if="${product.stock <= 0}">Out of stock</p>

        <form th:action="@{/cart/add}" method="post" th:if="${product.stock > 0}">
            <input type="hidden" name="productId" th:value="${product.id}">
            <div class="qty-row">
                <label for="qty" style="margin:0">Quantity</label>
                <input id="qty" type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                <button class="btn" type="submit">Add to cart</button>
            </div>
        </form>
        <p class="muted">Free delivery on orders above ₹499. Cash on delivery available.</p>
    </div>
</div>

<h2 th:if="${!related.isEmpty()}">You may also like</h2>
<div class="grid">
    <th:block th:each="p : ${related}">
        <div th:replace="~{fragments/layout :: productCard(${p})}"></div>
    </th:block>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
